<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JPBC Web Designs">
  <!--
    Filled badge (not a transparent glyph) so the mark reads on light and dark
    tab strips alike. Geometry is deliberately fat-stroked and gradient-free:
    the 9-unit stroke is 2.25px at 16x16, which survives downscaling.
    Colours are the signboard pair from the logo: sand-gold lettering on royal
    blue. The dark-scheme block adds a faint sand rim so the badge stays crisp against
    dark browser chrome.
  -->
  <style>
    .badge { fill: #1d4ed8; }
    .rim { fill: none; stroke: #f6dfb2; stroke-opacity: 0; stroke-width: 2; }
    .mark { fill: none; stroke: #f6dfb2; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .rim { stroke-opacity: 0.4; }
    }
  </style>
  <rect class="badge" width="64" height="64" rx="10" />
  <rect class="rim" x="1" y="1" width="62" height="62" rx="9" />
  <path class="mark" d="M22 20H44M38 20V35A9 9 0 0 1 20 35" />
</svg>
