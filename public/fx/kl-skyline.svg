<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120">
  <!-- Kuala Lumpur skyline silhouette, used as a CSS mask on the dark-mode
       service cards. Left to right: low-rises, Menara KL, Petronas Twin
       Towers with the skybridge, Merdeka 118, low-rises. -->
  <g fill="#000" transform="translate(80 0)">
    <rect x="0" y="92" width="18" height="28"/>
    <rect x="16" y="84" width="14" height="36"/>
    <rect x="30" y="96" width="16" height="24"/>
    <rect x="44" y="78" width="12" height="42"/>
    <rect x="56" y="88" width="20" height="32"/>
    <!-- Menara KL -->
    <rect x="88.5" y="44" width="3" height="76"/>
    <path d="M80 44h20l-3-8H83z"/>
    <path d="M82 36q8-8 16 0z"/>
    <rect x="89.5" y="10" width="1" height="22"/>
    <circle cx="90" cy="22" r="1.6"/>
    <rect x="76" y="100" width="12" height="20"/>
    <rect x="100" y="90" width="16" height="30"/>
    <rect x="114" y="82" width="14" height="38"/>
    <rect x="128" y="96" width="12" height="24"/>
    <!-- Petronas Twin Towers -->
    <rect x="140" y="40" width="16" height="80"/>
    <rect x="141.5" y="32" width="13" height="8"/>
    <rect x="143" y="25" width="10" height="7"/>
    <rect x="144.5" y="19" width="7" height="6"/>
    <rect x="146" y="14" width="4" height="5"/>
    <path d="M147.2 14 148 1l.8 13z"/>
    <rect x="172" y="40" width="16" height="80"/>
    <rect x="173.5" y="32" width="13" height="8"/>
    <rect x="175" y="25" width="10" height="7"/>
    <rect x="176.5" y="19" width="7" height="6"/>
    <rect x="178" y="14" width="4" height="5"/>
    <path d="M179.2 14 180 1l.8 13z"/>
    <rect x="156" y="62" width="16" height="3"/>
    <path d="M156 65h2.5l6 11h-2.5zM172 65h-2.5l-6 11h2.5z"/>
    <rect x="156" y="104" width="16" height="16"/>
    <rect x="192" y="86" width="18" height="34"/>
    <rect x="208" y="74" width="14" height="46"/>
    <rect x="222" y="92" width="22" height="28"/>
    <rect x="242" y="80" width="12" height="40"/>
    <rect x="254" y="88" width="14" height="32"/>
    <!-- Merdeka 118 -->
    <path d="M268 120V50l6-16 5-14 .5-18h1l.5 18 5 14 6 16v70z"/>
    <rect x="292" y="84" width="18" height="36"/>
    <rect x="308" y="94" width="18" height="26"/>
    <rect x="324" y="76" width="14" height="44"/>
    <rect x="336" y="90" width="20" height="30"/>
    <rect x="354" y="82" width="12" height="38"/>
    <rect x="366" y="96" width="18" height="24"/>
    <rect x="382" y="88" width="18" height="32"/>
    <rect x="0" y="116" width="400" height="4"/>
  </g>
  <!-- Low-rises either side, so the towers stay short on a wide card -->
  <g fill="#000">
    <rect x="0" y="100" width="20" height="20"/>
    <rect x="18" y="94" width="14" height="26"/>
    <rect x="32" y="104" width="18" height="16"/>
    <rect x="48" y="96" width="16" height="24"/>
    <rect x="62" y="102" width="20" height="18"/>
    <rect x="478" y="98" width="18" height="22"/>
    <rect x="494" y="104" width="16" height="16"/>
    <rect x="508" y="94" width="14" height="26"/>
    <rect x="522" y="102" width="20" height="18"/>
    <rect x="540" y="97" width="20" height="23"/>
    <rect x="0" y="116" width="560" height="4"/>
  </g>
</svg>
